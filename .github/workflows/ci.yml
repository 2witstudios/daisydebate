name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  # bun policy lists open PRs to catch ADR and migration number clashes.
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions are pinned to full commit SHAs with the version as a trailing
# comment; Dependabot proposes the bumps (ADR 0040, `bun policy` enforces).
# Turbo restores content-addressed task results; service tests remain uncached.
jobs:
  quick-check:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/quick-check.yml

  checks:
    needs: quick-check
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          [
            format:check,
            lint,
            policy,
            knip,
            duplication,
            invariants,
            evidence,
            metrics:check,
            typecheck,
            test,
            build,
          ]
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # No DATABASE_URL or REDIS_URL here on purpose: this job declares no
      # services, and none of these static/unit/build gates parse or dial
      # them (environment is validated lazily at runtime, not at build).
      PUBLIC_APP_URL: https://ci.example.invalid
      APP_VERSION: ci
      GIT_COMMIT: ${{ github.sha }}
      # Nonempty sentinels: the `build` task's check:build-isolation step
      # (AUTH-6.3) greps the compiled client bundle for these exact values
      # to prove no server secret leaks into browser-shipped code. An empty
      # value here would let that scan search for "" and never find a real
      # leak. BETTER_AUTH_SECRET and RECIPIENT_HASH_SECRET must each satisfy
      # config's 64-char shape.
      BETTER_AUTH_SECRET: ci-isolation-sentinel-auth-0000000000000000000000000000000000000
      RECIPIENT_HASH_SECRET: ci-isolation-sentinel-recipient-hash-000000000000000000000000000
      RESEND_API_KEY: ci-isolation-sentinel-resend-key
      RESEND_WEBHOOK_SECRET: ci-isolation-sentinel-webhook-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Start task measurement
        run: echo "CI_TASK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/turbo-cache
        with:
          task: checks-${{ matrix.task }}
      - run: bun run ${{ matrix.task }}
        env:
          GH_TOKEN: ${{ matrix.task == 'policy' && github.token || '' }}
      - uses: ./.github/actions/turbo-cache
        with:
          task: checks-${{ matrix.task }}
          phase: save
      - name: Report task measurement
        env:
          TASK: ${{ matrix.task }}
        run: echo "### $TASK — $(( $(date +%s) - CI_TASK_STARTED )) seconds including cache restore/save" >> "$GITHUB_STEP_SUMMARY"

  # Exercise the pruned image inputs used by both web and migrator, not
  # only the full-checkout install in the checks matrix (ISSUE-405).
  image:
    needs: quick-check
    name: Web and migrator image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shared runtime image with both frozen installs
        run: docker build --progress=plain -f apps/web/Dockerfile -t daisy-web-ci .
      - name: Import ingress and media from the production image
        run: >-
          docker run --rm --entrypoint bun daisy-web-ci --eval
          'await import("@daisy/ingress/client-ip"); await import("../../packages/media/src/index.ts");'
      # ADR 0077: the admin stages deploy from this Dockerfile too, so they
      # are built and booted here before any deploy does it first.
      - name: Build the admin and admin migrator stages
        run: |
          docker build --progress=plain -f apps/web/Dockerfile --target admin -t daisy-admin-ci .
          docker build --progress=plain -f apps/web/Dockerfile --target admin-migrate -t daisy-admin-migrate-ci .
      - name: Boot each admin image to its configuration refusal
        run: |
          refuses() {
            if output=$(docker run --rm "$1" 2>&1); then
              echo "$1 started without its configuration"; exit 1
            fi
            grep -F "$2" <<<"$output" || { echo "$output"; exit 1; }
          }
          refuses daisy-admin-ci 'Invalid admin configuration: ADMIN_DATABASE_URL'
          refuses daisy-admin-migrate-ci 'Invalid admin configuration: ADMIN_MIGRATION_DATABASE_URL'

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run audit

  migrations:
    name: Migration journal collision guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Full history: the guard compares the committed journal against the
    # merge base with origin/main, so a shallow checkout cannot run it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun migrations:check

  integration:
    needs: quick-check
    name: Infrastructure contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://daisy:ci-only@127.0.0.1:5432/daisy_test
      TEST_DATABASE_URL: postgres://daisy:ci-only@127.0.0.1:5432/daisy_test
      # The admin app's own test database (ADR 0077), created and migrated below.
      TEST_ADMIN_DATABASE_URL: postgres://daisy:ci-only@127.0.0.1:5432/daisy_admin_test
      REDIS_URL: redis://127.0.0.1:6379/1
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      REDIS_NAMESPACE: ci
      PUBLIC_APP_URL: http://127.0.0.1:3100
      NODE_ENV: development
      FOUNDATION_PROOF_ENABLED: 'true'
      CLAMD_TEST_PORT: '3310'
      APP_VERSION: ci
      GIT_COMMIT: ${{ github.sha }}
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: daisy_test
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Redis (memory-only, 512 databases), LiveKit (dev-only keys from
      # infra/livekit.yaml) and the pinned clamd come from the local compose
      # stack itself, so CI and every slot run one shape; service containers
      # cannot pass flags.
      - run: docker compose -f infra/compose.yaml up -d --wait redis livekit clamd
      - run: bun db:migrate
      - name: Verify migration reruns are idempotent
        run: bun db:migrate
      # The one place test logins are provisioned (packages/db/src/slots.ts),
      # after the baseline has created daisy_web.
      - run: bun db:roles
      - name: Create and migrate the admin test database
        run: |
          bun -e "const sql = new Bun.SQL(process.env.DATABASE_URL); await sql.unsafe('create database daisy_admin_test'); await sql.close();"
          ADMIN_MIGRATION_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" bun apps/admin/src/db/migrate.ts
          ADMIN_MIGRATION_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" bun apps/admin/src/db/migrate.ts
      - run: bun test:integration
      # The browser E2E tier is owned by e2e.yml (a single E2E owner keeps
      # per-PR cost at one Chromium run; bun evidence enforces the split).

  # The one required check for the main ruleset (policy/github/repository.json)
  # and the CI half of deploy-staging's condition: it passes only when every
  # CI job above passed, the dependency audit included (ADR 0039).
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quick-check, checks, image, audit, migrations, integration]
    if: always()
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "CI gate: a required job ended $result"
              exit 1
            fi
          done

  notify-drive:
    name: Report failure to drive Incidents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quick-check, checks, image, audit, migrations, integration]
    if: failure()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Post the failure to the Incidents channel
        env:
          PAGESPACE_INCIDENTS_WEBHOOK_URL: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_URL }}
          PAGESPACE_INCIDENTS_WEBHOOK_SECRET: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_SECRET }}
          NOTIFY_REF: ${{ github.ref_name }}
          NOTIFY_SHA: ${{ github.sha }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/notify-drive.ts incidents
          --ref "$NOTIFY_REF"
          --sha "$NOTIFY_SHA"
          --run-url "$NOTIFY_RUN_URL"
          --tasks "$NOTIFY_REF"
