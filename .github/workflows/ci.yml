name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Deliberately supported major action pins; Dependabot proposes major upgrades.
# No shared task-output cache: correctness runs fresh; setup-bun caches its binary.
jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          [
            format:check,
            lint,
            policy,
            knip,
            invariants,
            evidence,
            metrics:check,
            typecheck,
            test,
            build,
          ]
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://daisy:ci-only@postgres:5432/daisy_test
      REDIS_URL: redis://redis:6379
      PUBLIC_APP_URL: https://ci.example.invalid
      APP_VERSION: ci
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}

  migrations:
    name: Migration journal collision guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Full history: the guard compares the committed journal against the
    # merge base with origin/main, so a shallow checkout cannot run it.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun migrations:check

  integration:
    name: Infrastructure contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://daisy:ci-only@127.0.0.1:5432/daisy_test
      TEST_DATABASE_URL: postgres://daisy:ci-only@127.0.0.1:5432/daisy_test
      REDIS_URL: redis://127.0.0.1:6379/1
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      REDIS_NAMESPACE: ci
      PUBLIC_APP_URL: http://127.0.0.1:3100
      NODE_ENV: development
      FOUNDATION_PROOF_ENABLED: 'true'
      APP_VERSION: ci
      GIT_COMMIT: ${{ github.sha }}
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: daisy_test
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.6.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Create the loopback e2e role (production-refined credentials)
        run: |
          psql postgresql://daisy:ci-only@127.0.0.1:5432/postgres \
            -c "CREATE ROLE daisy_e2e LOGIN PASSWORD 'e2e-loopback-only';" \
            -c "GRANT CONNECT ON DATABASE daisy_test TO daisy_e2e;"
      - run: bun db:migrate
      - name: Verify migration reruns are idempotent
        run: bun db:migrate
      - run: bun test:integration
      # The browser E2E tier is owned by e2e.yml (a single E2E owner keeps
      # per-PR cost at one Chromium run; bun evidence enforces the split).

  notify-drive:
    name: Report failure to drive Incidents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [checks, migrations, integration]
    if: failure()
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Post the failure to the Incidents channel
        env:
          PAGESPACE_INCIDENTS_WEBHOOK_URL: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_URL }}
          PAGESPACE_INCIDENTS_WEBHOOK_SECRET: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_SECRET }}
          NOTIFY_REF: ${{ github.ref_name }}
          NOTIFY_SHA: ${{ github.sha }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/notify-drive.ts incidents
          --ref "$NOTIFY_REF"
          --sha "$NOTIFY_SHA"
          --run-url "$NOTIFY_RUN_URL"
          --tasks "$NOTIFY_REF"
