name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Same per-PR group as ci.yml: superseded pushes cancel instead of queueing
# a second Chromium run for code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: daisy_test
          POSTGRES_USER: daisy_e2e
          POSTGRES_PASSWORD: e2e-loopback-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisy_e2e -d daisy_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.6.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply test migrations
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_test

      - name: Build production server
        run: bun run build

      - name: Install Playwright browser
        run: bunx --bun playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run --cwd apps/web test:e2e
        env:
          CI: true
          # Explicit slot values: the config never defaults to a database.
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_test
          E2E_REDIS_URL: redis://localhost:6379/2
          E2E_REDIS_NAMESPACE: ci-e2e

      - name: Upload browser artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
