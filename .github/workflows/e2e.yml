name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
  # AUTH-6.2-AC7: the release-qualification gate (three consecutive full
  # suite runs, retries disabled) is not a per-PR check — it runs only on
  # manual dispatch, on this uncontended runner instead of a shared
  # development machine, alongside the unchanged single-run push/PR gate.
  workflow_dispatch:

permissions:
  contents: read

# Same per-PR group as ci.yml: superseded pushes cancel instead of queueing
# a second Chromium run for code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    # A manual dispatch runs the three-consecutive-run release
    # qualification instead of the single-run PR gate; three full suites
    # need more than the single-run budget below.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 20 }}
    # The read-only fixture admission CLI derives the canonical main slot
    # from this checkout. Dev/test URLs are identity metadata only; browser
    # connections use the separately provisioned DML-only E2E login below.
    env:
      DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy
      TEST_DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_test
      REDIS_NAMESPACE: daisy
      E2E_REDIS_NAMESPACE: daisy-e2e
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          # The migration owner, as in ci.yml and every local slot; the
          # browser suite's server runs as daisy_e2e, a DML-only member of
          # daisy_web provisioned below, in its own e2e database.
          POSTGRES_DB: daisy_e2e
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.6.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to the e2e database
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      # The one place test logins are provisioned (packages/db/src/slots.ts).
      - name: Provision the e2e login
        run: bun db:roles
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      - uses: ./.github/actions/turbo-cache
        with:
          task: browser-build

      - name: Build production server
        run: bun run build
        env:
          # Nonempty sentinels for check:build-isolation's client-bundle
          # secret scan (AUTH-6.3) — see ci.yml's `build` job for why an
          # empty value here would make that scan a no-op. The actual e2e
          # server this build ships to runs afterward under its own
          # inert placeholder secrets (playwright.config.ts webServer.env);
          # these values are for the static build step only.
          BETTER_AUTH_SECRET: ci-isolation-sentinel-auth-0000000000000000000000000000000000000
          RECIPIENT_HASH_SECRET: ci-isolation-sentinel-recipient-hash-000000000000000000000000000
          RESEND_API_KEY: ci-isolation-sentinel-resend-key
          RESEND_WEBHOOK_SECRET: ci-isolation-sentinel-webhook-secret

      - uses: ./.github/actions/turbo-cache
        with:
          task: browser-build
          phase: save

      - name: Resolve the Playwright version and cache month
        id: playwright
        run: |
          echo "version=$(jq -r .version apps/web/node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Browsers and the OS packages' .debs, keyed on the exact Playwright
      # version: a warm run skips both downloads, including the Ubuntu
      # mirror that stalled whole jobs. The month rolls the .debs forward
      # with Ubuntu's updates.
      - name: Restore Playwright browsers and OS packages
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.month }}-chromium-firefox-webkit

      # Also installs zip/unzip: scripts/e2e-artifact-sanitizer.ts shells
      # out to them to redact retained trace archives, a path exercised only
      # when a test fails, so the job must not rely on the base image.
      # The step bound sits inside the 20-minute job budget (ci-browsers.sh
      # stops after three apt attempts).
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: sh scripts/ci-browsers.sh chromium firefox webkit

      # Saved straight after the install, so a later test failure still
      # keeps the warm cache.
      - name: Save Playwright browsers and OS packages
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Run browser tests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: bun run --cwd apps/web test:e2e
        env:
          CI: true
          # Explicit slot values: the config never defaults to a database.
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_e2e
          E2E_REDIS_URL: redis://localhost:6379/2

      # AUTH-6.2-AC7: three consecutive full-suite runs, retries disabled
      # (the standing playwright.config.ts default), every outcome kept.
      - name: Run release-qualification (three consecutive full-suite runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun test:e2e:qualify
        env:
          CI: true
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_e2e
          E2E_REDIS_URL: redis://localhost:6379/2

      - name: Report discovered/executed/pass/fail/skip counts
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/results.json

      - name: Sanitize retained artifacts before upload
        id: sanitize
        if: ${{ !cancelled() }}
        run: |
          bun scripts/e2e-artifact-sanitizer.ts apps/web/test-results apps/web/playwright-report apps/web/qualification-results

      # Never upload when sanitization itself failed (e.g. a corrupt trace
      # archive it could not extract and scan): an unscanned artifact cannot
      # be proven clean, so it must not leave the runner.
      - name: Upload browser artifacts
        if: ${{ failure() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # The release-qualification report is the AUTH-6.2-AC7 artifact
      # itself: upload it on success too, not only on failure.
      - name: Upload release-qualification report
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-qualification-${{ github.run_id }}
          path: apps/web/qualification-results/
          if-no-files-found: error
          retention-days: 30

  # ADR 0077: the admin app's operator journey on its own canonical origin
  # (http://localhost:4800) and its own database; Chromium only, through
  # the CDP virtual authenticator.
  admin:
    name: Admin E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: daisy_admin_e2e
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_admin_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the admin app
        run: bun run --cwd apps/admin build

      - name: Resolve the Playwright version and cache month
        id: playwright
        run: |
          echo "version=$(jq -r .version apps/web/node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium and OS packages
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.month }}-chromium

      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: sh scripts/ci-browsers.sh chromium

      - name: Save Playwright Chromium and OS packages
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # The webServer migrates this database, empties it and provisions the
      # DML-only login the server runs as (apps/admin/e2e/support/prepare.ts).
      - name: Run the admin journey
        run: bun run --cwd apps/admin test:e2e
        env:
          CI: true
          E2E_ADMIN_DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_admin_e2e

  room-launch:
    name: Isolated Room Launch E2E
    runs-on: ubuntu-24.04
    # One shared slot keeps the suite on a single worker: about 3 min of
    # setup, about 30 min of Launch tests (multi-minute attendance outages and
    # autonomous journeys), then the realtime proofs and artifact sanitizing.
    # 30 cancelled it two tests short (ISSUE-471-r1); the suite itself stays
    # bounded by heavy.ts (45 min).
    timeout-minutes: 55
    env:
      CLAMD_TEST_PORT: '3310'
    defaults:
      run:
        working-directory: .pu/worktrees/wt-roomlaunchci
    # PostgreSQL, Redis, LiveKit and clamd are the local compose stack,
    # which `bun slot:up` starts exactly as on a development machine.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Create dedicated native proof checkout
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach .pu/worktrees/wt-roomlaunchci "$GITHUB_SHA"
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Initialize own environment
        run: cp .env.example .env
      - name: Create and migrate only the derived proof slot
        id: slot
        run: bun slot:up
      - name: Check services and slot identity
        id: doctor
        run: bun doctor
      - name: Prove target refusals before browser work
        run: bun test apps/web/scripts/room-launch-proof.test.ts
      - name: Prove main checkout teardown refuses before connection
        run: |
          set +e
          output=$(bun scripts/slot.ts down --checkout "$GITHUB_WORKSPACE" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$output" != 'slot:down refuses the main checkout: its databases are the shared defaults' ]; then
            echo 'Main teardown refusal proof failed'
            exit 1
          fi
          echo 'Main checkout teardown refused before connection'
      - uses: ./.github/actions/turbo-cache
        with:
          task: native-build
          checkout: .pu/worktrees/wt-roomlaunchci
      - name: Build composed production server
        id: build
        run: bun run build
        env:
          BETTER_AUTH_SECRET: ci-isolation-sentinel-auth-0000000000000000000000000000000000000
          RECIPIENT_HASH_SECRET: ci-isolation-sentinel-recipient-hash-000000000000000000000000000
          RESEND_API_KEY: ci-isolation-sentinel-resend-key
          RESEND_WEBHOOK_SECRET: ci-isolation-sentinel-webhook-secret
      - uses: ./.github/actions/turbo-cache
        with:
          task: native-build
          checkout: .pu/worktrees/wt-roomlaunchci
          phase: save
      - name: Resolve the Playwright version and cache month
        id: playwright
        run: |
          echo "version=$(jq -r .version apps/web/node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Browsers and the OS packages' .debs, keyed on the exact Playwright
      # version: a warm run skips both downloads, including the Ubuntu
      # mirror that stalled whole jobs. The month rolls the .debs forward
      # with Ubuntu's updates.
      - name: Restore Playwright browsers and OS packages
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.month }}-chromium
      - name: Install controlled Chromium and artifact tools
        id: chromium
        timeout-minutes: 8
        run: sh scripts/ci-browsers.sh chromium
      # Saved straight after the install, so a later test failure still
      # keeps the warm cache.
      - name: Save Playwright browsers and OS packages
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/daisy-apt-archives
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Run real isolated Launch browser suite
        id: launch
        run: bun test:e2e:room-launch
        env:
          CI: true
          ROOM_LAUNCH_NODE: node
      - name: Run authenticated generic realtime browser proof
        id: realtime_room
        if: ${{ !cancelled() && steps.doctor.outcome == 'success' && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: bun test:e2e:realtime
        env:
          CI: true
          REALTIME_BROWSER_NODE: node
      - name: Report actual generic realtime outcomes
        if: ${{ always() && !cancelled() }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/realtime-results.json
      - name: Run authenticated messaging realtime browser proof
        id: realtime_messaging
        if: ${{ !cancelled() && steps.doctor.outcome == 'success' && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: bun test:e2e:messaging-realtime
        env:
          CI: true
          REALTIME_BROWSER_NODE: node
      - name: Report actual messaging realtime outcomes
        if: ${{ always() && !cancelled() }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/messaging-realtime-results.json
      - name: Report actual discovered and executed outcomes
        if: ${{ always() && !cancelled() && (steps.launch.outcome == 'success' || steps.launch.outcome == 'failure') }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/room-launch-results.json
      - name: Sanitize retained proof artifacts
        id: sanitize_launch
        if: ${{ always() && !cancelled() && (steps.launch.outcome == 'success' || steps.launch.outcome == 'failure') }}
        run: bun scripts/e2e-artifact-sanitizer.ts apps/web/test-results apps/web/playwright-report
      - name: Retain Launch evidence on success and failure
        if: ${{ always() && !cancelled() && steps.sanitize_launch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-launch-${{ github.run_id }}
          path: .pu/worktrees/wt-roomlaunchci/apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
      # No reviewer attaches to this ephemeral job's live slot. Evidence is
      # retained first; release checks its own derived scope and main sentinel.
      - name: Release only the completed suite-owned slot
        if: ${{ always() && steps.slot.outcome == 'success' }}
        run: bun --env-file=.env apps/web/e2e/support/room-launch-release.ts
