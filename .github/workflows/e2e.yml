name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Same per-PR group as ci.yml: superseded pushes cancel instead of queueing
# a second Chromium run for code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          # The migration owner, as in ci.yml and every local slot; the
          # browser suite's server runs as daisy_e2e, a DML-only member of
          # daisy_web provisioned below, in its own e2e database.
          POSTGRES_DB: daisy_e2e
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.6.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # scripts/e2e-artifact-sanitizer.ts shells out to unzip/zip to redact
      # retained trace archives before upload; that path is only exercised
      # when a test actually fails and Playwright retains a trace, so it was
      # never proven against this runner image until AUTH-6 hit its first
      # real CI failure. Installing explicitly removes any dependency on
      # the base image happening to include them.
      - name: Ensure zip/unzip are available for artifact sanitization
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip

      - name: Apply migrations to the e2e database
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      # The one place test logins are provisioned (packages/db/src/slots.ts).
      - name: Provision the e2e login
        run: bun db:roles
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      - name: Build production server
        run: bun run build
        env:
          # Nonempty sentinels for check:build-isolation's client-bundle
          # secret scan (AUTH-6.3) — see ci.yml's `build` job for why an
          # empty value here would make that scan a no-op. The actual e2e
          # server this build ships to runs afterward under its own
          # inert placeholder secrets (playwright.config.ts webServer.env);
          # these values are for the static build step only.
          BETTER_AUTH_SECRET: ci-isolation-sentinel-auth-0000000000000000000000000000000000000
          RESEND_API_KEY: ci-isolation-sentinel-resend-key
          RESEND_WEBHOOK_SECRET: ci-isolation-sentinel-webhook-secret

      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: bun run --cwd apps/web test:e2e
        env:
          CI: true
          # Explicit slot values: the config never defaults to a database.
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_e2e
          E2E_REDIS_URL: redis://localhost:6379/2
          E2E_REDIS_NAMESPACE: ci-e2e

      - name: Report discovered/executed/pass/fail/skip counts
        if: ${{ !cancelled() }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/results.json

      - name: Sanitize retained artifacts before upload
        id: sanitize
        if: ${{ !cancelled() }}
        run: |
          bun scripts/e2e-artifact-sanitizer.ts apps/web/test-results apps/web/playwright-report

      # Never upload when sanitization itself failed (e.g. a corrupt trace
      # archive it could not extract and scan): an unscanned artifact cannot
      # be proven clean, so it must not leave the runner.
      - name: Upload browser artifacts
        if: ${{ failure() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
