name: Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright browser suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The read-only fixture admission CLI derives the canonical main slot
    # from this checkout. Dev/test URLs are identity metadata only; browser
    # connections use the separately provisioned DML-only E2E login below.
    env:
      DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy
      TEST_DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_test
      REDIS_NAMESPACE: daisy
      E2E_REDIS_NAMESPACE: daisy-e2e
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          # The migration owner, as in ci.yml and every local slot; the
          # browser suite's server runs as daisy_e2e, a DML-only member of
          # daisy_web provisioned below, in its own e2e database.
          POSTGRES_DB: daisy_e2e
          POSTGRES_USER: daisy
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisy -d daisy_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.6.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: f80af91e195aa5a5e2a3aa031e48012faeaa2146

      - name: Verify exact PR source
        run: test "$(git rev-parse HEAD)" = "f80af91e195aa5a5e2a3aa031e48012faeaa2146" && git log -1 --format=%H

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to the e2e database
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      # The one place test logins are provisioned (packages/db/src/slots.ts).
      - name: Provision the e2e login
        run: bun db:roles
        env:
          DATABASE_URL: postgres://daisy:ci-only@localhost:5432/daisy_e2e

      - uses: ./.github/actions/turbo-cache
        with:
          task: browser-build

      - name: Build production server
        run: bun run build
        env:
          # Nonempty sentinels for check:build-isolation's client-bundle
          # secret scan (AUTH-6.3) — see ci.yml's `build` job for why an
          # empty value here would make that scan a no-op. The actual e2e
          # server this build ships to runs afterward under its own
          # inert placeholder secrets (playwright.config.ts webServer.env);
          # these values are for the static build step only.
          BETTER_AUTH_SECRET: ci-isolation-sentinel-auth-0000000000000000000000000000000000000
          RECIPIENT_HASH_SECRET: ci-isolation-sentinel-recipient-hash-000000000000000000000000000
          RESEND_API_KEY: ci-isolation-sentinel-resend-key
          RESEND_WEBHOOK_SECRET: ci-isolation-sentinel-webhook-secret

      - uses: ./.github/actions/turbo-cache
        with:
          task: browser-build
          phase: save

      - name: Resolve the Playwright version
        id: playwright
        run: |
          echo "version=$(jq -r .version apps/web/node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      # Browsers keyed on the exact Playwright version, and the OS packages'
      # .debs: a warm run skips both downloads, including the Ubuntu mirror
      # that stalled whole jobs.
      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || 'chromium-firefox-webkit' }}
      # The newest .deb set for this version: Ubuntu's updates land in a new
      # entry (ci-browsers.sh reports debs=changed), never in a stale one.
      - name: Restore the browsers' OS packages
        id: deb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/daisy-apt-archives
          key: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || 'chromium-firefox-webkit' }}_${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || 'chromium-firefox-webkit' }}_

      # Also installs zip/unzip: scripts/e2e-artifact-sanitizer.ts shells
      # out to them to redact retained trace archives, a path exercised only
      # when a test fails, so the job must not rely on the base image.
      # The step bound sits inside the 25-minute job budget (ci-browsers.sh
      # stops after three apt attempts).
      - name: Install Playwright browsers
        id: browsers
        timeout-minutes: 8
        env:
          BROWSERS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || 'chromium firefox webkit' }}
        # Word splitting is the point: one argument per browser.
        run: sh scripts/ci-browsers.sh $BROWSERS

      # Saved straight after the install, so a later test failure still
      # keeps the warm cache.
      - name: Save Playwright browsers
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Save the browsers' refreshed OS packages
        if: ${{ steps.browsers.outputs.debs == 'changed' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/daisy-apt-archives
          key: ${{ steps.deb-cache.outputs.cache-primary-key }}

      # A PR and a main push run Chromium alone; the nightly run runs every project.
      - name: Run browser tests
        run: bun run --cwd apps/web test:e2e
        env:
          CI: true
          # Explicit slot values: the config never defaults to a database.
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_e2e
          E2E_REDIS_URL: redis://localhost:6379/2

      # PHOG: configured production-app consent and identity proof with local vendor transport.
      - name: Run configured analytics native lifecycle
        run: |
          bun run --cwd apps/web test:e2e:analytics
          bun scripts/e2e-report-counts.ts apps/web/test-results/analytics-native/results.json
        env:
          CI: true
          E2E_DATABASE_URL: postgres://daisy_e2e:e2e-loopback-only@localhost:5432/daisy_e2e
          E2E_REDIS_URL: redis://localhost:6379/2

      - name: Report discovered/executed/pass/fail/skip counts
        if: ${{ !cancelled() }}
        run: bun scripts/e2e-report-counts.ts apps/web/test-results/results.json

      - name: Sanitize retained artifacts before upload
        id: sanitize
        if: ${{ !cancelled() }}
        run: |
          bun scripts/e2e-artifact-sanitizer.ts apps/web/test-results apps/web/playwright-report apps/web/qualification-results

      # Never upload when sanitization itself failed (e.g. a corrupt trace
      # archive it could not extract and scan): an unscanned artifact cannot
      # be proven clean, so it must not leave the runner.
      - name: Upload browser artifacts
        if: ${{ failure() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7


      - name: Upload single-suite counts
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-2-single-browser-${{ github.run_id }}
          path: apps/web/test-results/results.json
          if-no-files-found: error
          retention-days: 7
