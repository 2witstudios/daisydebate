name: Deploy staging
# Continuous deployment of main to the always-on Fly.io staging app
# (AUTH-7.0, DEC-40). A main push deploys once the CI gate job and the Browser E2E
# run are both green (scripts/staging-gate.ts, ISSUE-51); the gate includes
# the dependency audit (ADR 0039). The release-only migrator app
# (fly.migrate.toml) deploys first: its release command migrates as the
# schema owner and it creates no machines. Only then does `fly deploy` build
# and roll out the web app, which never holds the owner credential (ISSUE-102,
# ADR 0041). Both build on the runner from apps/web/Dockerfile
# (--local-only, ISSUE-542), as do the realtime service and the capture
# worker (their own stages, ISSUE-528); the LiveKit SFU deploys only when a
# merge changes it. Production rollout is
# a separate, human-gated step (AUTH-7.2/7.3) and is never automated here.
on:
  workflow_run:
    workflows: [CI, Browser E2E]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  ready:
    name: Require a green CI gate and green E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Both workflows also run on pull_request, so a PR whose source branch
    # is named "main" would satisfy the branches filter: require the run to
    # come from a push to this repository's main, never from a PR head.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      # Read by notify-drive below to name the failing step.
      outcomes: >-
        ready.checkout=${{ steps.checkout.outcome }}
        ready.setup-bun=${{ steps.setup-bun.outcome }}
        ready.decide=${{ steps.decide.outcome }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER: ${{ github.event.workflow_run.name }}
        run: bun scripts/staging-gate.ts --sha "$HEAD_SHA" --trigger "$TRIGGER"

  deploy:
    name: Deploy main to daisy-debate-staging
    runs-on: ubuntu-24.04
    # Nine deploys (migrator, LiveKit, realtime, web, capture worker, log
    # store, log shipper, admin migrator, admin) run
    # back to back, each building on this runner and pushing its image.
    timeout-minutes: 60
    needs: ready
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.ready.outputs.deploy == 'true')
    env:
      # The commit CI verified, used for checkout AND the image metadata so
      # the deployed source and its stamped version can never diverge
      # (GITHUB_SHA is the default-branch tip at run time, not this commit).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      # Read by notify-drive below to name the failing step.
      outcomes: >-
        deploy.checkout=${{ steps.checkout.outcome }}
        deploy.setup-flyctl=${{ steps.setup-flyctl.outcome }}
        deploy.migrate=${{ steps.migrate.outcome }}
        deploy.livekit=${{ steps.livekit.outcome }}
        deploy.realtime=${{ steps.realtime.outcome }}
        deploy.deploy=${{ steps.deploy.outcome }}
        deploy.media-worker=${{ steps.media-worker.outcome }}
        deploy.clickhouse=${{ steps.clickhouse.outcome }}
        deploy.log-shipper=${{ steps.log-shipper.outcome }}
        deploy.admin-migrate=${{ steps.admin-migrate.outcome }}
        deploy.admin=${{ steps.admin.outcome }}
        deploy.readiness=${{ steps.readiness.outcome }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Full history, so the LiveKit step can diff against whatever
          # commit the SFU last deployed from, however many merges back.
          fetch-depth: 0
          persist-credentials: false
      - id: setup-flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - id: migrate
        name: Migrate
        # Every deploy below builds on this runner (--local-only, ISSUE-542),
        # sharing one Docker cache, so the Next build runs once per job; Fly's
        # 4-CPU Depot builder stalled it (scripts/verify-image-build.ts).
        # The migrator app's own deploy token, scoped to this step: it can
        # deploy only daisy-debate-staging-migrate, whose sole secret is the
        # owner credential. --update-only creates no machines, so only the
        # release command's temporary machine ever holds that credential; a
        # failed migration fails this step and the web deploy never runs.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MIGRATE_API_TOKEN }}
        run: >-
          flyctl deploy -c fly.migrate.toml --local-only --update-only
          --build-arg APP_VERSION="${DEPLOY_SHA::7}"
          --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: livekit
        name: Deploy LiveKit
        # ISSUE-528: the staging SFU (fly.livekit.toml), a pinned image.
        # Redeploying it ends every live call, so a main push redeploys it
        # only when its image or config changed since the commit it last
        # deployed from (LIVEKIT_SOURCE_COMMIT on its machine), which also
        # catches changes from pushes that never deployed. An unknown or
        # missing source commit, or a manual run, always redeploys. Its own
        # app-scoped deploy token, as below.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LIVEKIT_API_TOKEN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          deployed="$(flyctl machines list -a daisy-debate-staging-livekit --json | jq -r '.[0].config.env.LIVEKIT_SOURCE_COMMIT // empty')"
          if [ "$MANUAL" != true ] && [ -n "$deployed" ] \
            && git cat-file -e "$deployed^{commit}" 2>/dev/null \
            && git diff --quiet "$deployed" HEAD -- infra/livekit fly.livekit.toml; then
            echo "LiveKit unchanged since $deployed; not redeployed"
            exit 0
          fi
          flyctl deploy -c fly.livekit.toml --local-only --ha=false \
            --env LIVEKIT_SOURCE_COMMIT="$DEPLOY_SHA"
      - id: realtime
        name: Deploy realtime
        # ISSUE-528: apps/realtime, the `realtime` stage of the web
        # Dockerfile (no Next build). Its token deploys only that app.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_REALTIME_API_TOKEN }}
        run: >-
          flyctl deploy -c fly.realtime.toml --local-only --ha=false
          --build-arg APP_VERSION="${DEPLOY_SHA::7}"
          --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: deploy
        name: Deploy
        # The deploy token is scoped to this one step, not the job, so the
        # checkout and setup actions never see it.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy -a daisy-debate-staging --local-only --ha=false
          --build-arg APP_VERSION="${DEPLOY_SHA::7}"
          --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: media-worker
        name: Deploy the capture worker
        # ISSUE-528: apps/media-worker, after the web app whose signed
        # internal route it posts to. Its token deploys only that app.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MEDIA_WORKER_API_TOKEN }}
        run: >-
          flyctl deploy -c fly.media-worker.toml --local-only --ha=false
          --build-arg APP_VERSION="${DEPLOY_SHA::7}"
          --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: clickhouse
        name: Deploy the log store
        # ADR 0084: 6PN-only ClickHouse, before the shipper and the admin app
        # that read its schema (store, shipper, admin). A restart drops the stream records
        # published meanwhile (the shipper keeps what it already holds), so
        # like LiveKit it redeploys only when its image or config changed
        # since the commit it last deployed from. Skips, reported as
        # unconfigured, until its deploy token exists.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CLICKHOUSE_API_TOKEN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_CLICKHOUSE_API_TOKEN is not set; the log store is unconfigured and was not deployed"
            exit 0
          fi
          deployed="$(flyctl machines list -a daisy-debate-staging-clickhouse --json | jq -r '.[0].config.env.CLICKHOUSE_SOURCE_COMMIT // empty')"
          if [ "$MANUAL" != true ] && [ -n "$deployed" ] \
            && git cat-file -e "$deployed^{commit}" 2>/dev/null \
            && git diff --quiet "$deployed" HEAD -- infra/clickhouse fly.clickhouse.toml; then
            echo "The log store is unchanged since $deployed; not redeployed"
            exit 0
          fi
          flyctl deploy -c fly.clickhouse.toml --local-only --ha=false --no-public-ips \
            --env CLICKHOUSE_SOURCE_COMMIT="$DEPLOY_SHA"
      - id: log-shipper
        name: Deploy the log shipper
        # ADR 0084: after the store it writes to. Skips, reported as
        # unconfigured, while either log pipeline token is missing.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LOG_SHIPPER_API_TOKEN }}
          STORE_READY: ${{ secrets.FLY_CLICKHOUSE_API_TOKEN != '' }}
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ "$STORE_READY" != true ]; then
            echo "Log pipeline deploy tokens are not set; the log shipper is unconfigured and was not deployed"
            exit 0
          fi
          flyctl deploy -c fly.log-shipper.toml --local-only --ha=false --no-public-ips \
            --build-arg APP_VERSION="${DEPLOY_SHA::7}" \
            --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: admin-migrate
        name: Migrate the admin database
        # ADR 0077: the release-only admin migrator, holding only the admin
        # database owner credential. Until the owner creates the app and its
        # deploy token (BETA-H), the secret is empty and this step skips.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ADMIN_MIGRATE_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_ADMIN_MIGRATE_API_TOKEN is not set; the admin database is not deployed yet"
            exit 0
          fi
          flyctl deploy -c fly.admin-migrate.toml --local-only --update-only \
            --build-arg APP_VERSION="${DEPLOY_SHA::7}" \
            --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: admin
        name: Deploy the admin app
        # 6PN only: no public address is ever allocated. Skips while either
        # admin token is missing, so it never runs on an unmigrated database.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ADMIN_API_TOKEN }}
          MIGRATOR_READY: ${{ secrets.FLY_ADMIN_MIGRATE_API_TOKEN != '' }}
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ "$MIGRATOR_READY" != true ]; then
            echo "Admin deploy tokens are not set; the admin app is not deployed yet"
            exit 0
          fi
          flyctl deploy -c fly.admin.toml --local-only --ha=false --no-public-ips \
            --build-arg APP_VERSION="${DEPLOY_SHA::7}" \
            --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - id: readiness
        name: Verify readiness
        run: |
          ready() {
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 "$1"; then
                return 0
              fi
              sleep 10
            done
            echo "$1 did not become ready" >&2
            return 1
          }
          ready https://daisy-debate-staging.fly.dev/api/health/ready
          ready https://daisy-debate-staging-realtime.fly.dev/health/ready
          ready https://daisy-debate-staging-livekit.fly.dev/

  # Staging failures reach the drive's Incidents channel as ci.yml's do, not
  # only Fly's own email. The message carries the app, the failing step
  # (from the outcomes above), the commit and the run URL; this job holds
  # no deploy or database credential, only the Incidents webhook, on the one
  # step that posts. It checks out the trusted default branch, never the
  # deployed commit, and runs even when the deploy job's checkout failed.
  notify-drive:
    name: Report a failed deploy to drive Incidents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [ready, deploy]
    if: failure()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Post the failure to the Incidents channel
        env:
          PAGESPACE_INCIDENTS_WEBHOOK_URL: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_URL }}
          PAGESPACE_INCIDENTS_WEBHOOK_SECRET: ${{ secrets.PAGESPACE_INCIDENTS_WEBHOOK_SECRET }}
          NOTIFY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_OUTCOMES: ${{ needs.ready.outputs.outcomes }} ${{ needs.deploy.outputs.outcomes }}
        run: >-
          bun scripts/notify-drive.ts incidents
          --deploy daisy-debate-staging
          --sha "$NOTIFY_SHA"
          --run-url "$NOTIFY_RUN_URL"
          --outcomes "$NOTIFY_OUTCOMES"
