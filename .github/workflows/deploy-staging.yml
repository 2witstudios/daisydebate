name: Deploy staging
# Continuous deployment of main to the scale-to-zero Fly.io staging app
# (AUTH-7.0). Runs only after the CI workflow succeeds on a main push, so a
# red main never reaches staging; `fly deploy` builds the image remotely
# with Fly's builder from apps/web/Dockerfile (see fly.toml) and runs the
# migration release command before traffic switches. Production rollout is
# a separate, human-gated step (AUTH-7.2/7.3) and is never automated here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy main to daisy-debate-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CI also runs on pull_request, so a PR whose source branch is named
    # "main" would satisfy the branches filter: require the run to come from
    # a push to this repository's main, never from a PR head.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      # The commit CI verified, used for checkout AND the image metadata so
      # the deployed source and its stamped version can never diverge
      # (GITHUB_SHA is the default-branch tip at run time, not this commit).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        # The deploy token is scoped to this one step, not the job, so the
        # checkout and setup actions never see it.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy -a daisy-debate-staging --remote-only --ha=false
          --build-arg APP_VERSION="${DEPLOY_SHA::7}"
          --build-arg GIT_COMMIT="$DEPLOY_SHA"
      - name: Verify readiness
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://daisy-debate-staging.fly.dev/api/health/ready; then
              exit 0
            fi
            sleep 10
          done
          echo "staging did not become ready" >&2
          exit 1
