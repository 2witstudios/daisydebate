name: Turbo task cache
description: Restore content-addressed results; fork PRs and dispatches never save.
inputs:
  task:
    description: Job profile, separating disjoint task writers
    required: true
  phase:
    description: Restore before tasks, save only after successful tasks
    default: restore
  checkout:
    description: Checkout containing the Turbo cache
    default: .
runs:
  using: composite
  steps:
    - name: Restore Turbo task results
      if: inputs.phase == 'restore'
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ inputs.checkout }}/.turbo/cache
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version') }}-${{ inputs.task }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version') }}-${{ inputs.task }}-
    - name: Save trusted Turbo task results
      if: >-
        inputs.phase == 'save' &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pu/')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ inputs.checkout }}/.turbo/cache
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version') }}-${{ inputs.task }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
