# Local shared-stack configuration only. These public development credentials
# must never be used for a hosted deployment.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 20
keys:
  daisy-local: local-development-only-livekit-secret
logging:
  level: warn
