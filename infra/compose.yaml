name: ${DAISY_STACK_NAME:-daisy}
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: daisy
      POSTGRES_USER: daisy
      POSTGRES_PASSWORD: local-development-only
    # Host port 15432 avoids colliding with common host-level Postgres installs.
    # DAISY_* knobs let a parallel local session (worktree, `pu` slot) run its
    # own isolated stack; see docs/development/local-development.md.
    ports: ['127.0.0.1:${DAISY_PG_PORT:-15432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-test-database.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daisy -d daisy']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.6.1-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports: ['127.0.0.1:${DAISY_REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
