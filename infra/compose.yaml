# The one shared local stack. Every checkout (the main checkout and each git
# worktree) uses these same services and gets its own databases and Redis
# namespaces from `bun slot:up`; see docs/decisions/0034-shared-stack-slots.md.
name: daisy
services:
  postgres:
    image: postgres:18.3-alpine
    # Every slot's dev server, test pools and e2e server share this cluster.
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_DB: daisy
      POSTGRES_USER: daisy
      POSTGRES_PASSWORD: local-development-only
    # Host port 15432 avoids colliding with common host-level Postgres installs.
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daisy -d daisy']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.6.1-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
