# Private admin: HTTPS Serve on the tailnet only. See docs/operations/private-admin.md.
app = "daisy-debate-staging-admin"
primary_region = "ord"
# The server drains for at most 10 s (SHUTDOWN_DEADLINE_MS in start.ts).
kill_timeout = 20

[build]
  dockerfile = "apps/web/Dockerfile"
  build-target = "admin"

[env]
  ADMIN_HOST = "127.0.0.1"
  ADMIN_ORIGIN = "https://daisy-admin.tail51baf2.ts.net"
  ADMIN_PORT = "8080"
  # The signed operator API (ADR 0079): web's private listener on 6PN, and
  # the audience web verifies against. With the two key secrets these make
  # the four settings the client needs, all or none.
  OPERATOR_API_URL = "http://daisy-debate-staging.internal:8081"
  OPERATOR_AUDIENCE = "daisy-web:staging"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "admin_tailscale_state"
  destination = "/var/lib/tailscale"
