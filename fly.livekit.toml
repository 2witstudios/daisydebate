# Staging LiveKit SFU (ISSUE-528, DEC-228): self-hosted, single node, no
# Redis. Its own Fly network (daisy-livekit, DEC-229): it reaches no private
# service, and the web app and capture worker call it at its public URL.
# Signalling and the server API are HTTPS on 443 through fly-proxy; media
# is raw UDP 7882 (fly-global-services, see infra/livekit/entrypoint.sh),
# with ICE over TCP 7881 as the fallback for networks that block UDP. Both
# need the dedicated IPv4 below ($2/month); shared IPv4 carries no UDP.
app = "daisy-debate-staging-livekit"
primary_region = "ord"
# A participant's session ends with the machine; 30 s lets LiveKit close
# rooms cleanly on a deploy instead of being killed mid-signal.
kill_timeout = 30

[build]
  dockerfile = "infra/livekit/Dockerfile"

[env]
  # The dedicated IPv4 from `fly ips list -a daisy-debate-staging-livekit`,
  # advertised in every ICE candidate. Not secret. LIVEKIT_KEYS is a Fly
  # secret, never written here.
  LIVEKIT_NODE_IP = "137.66.24.223"

[http_service]
  internal_port = 7880
  force_https = true
  # Always on, like the web app (DEC-40): a stopped SFU drops every call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # LiveKit answers "OK" on / once it serves.
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "2s"

[[services]]
  protocol = "udp"
  internal_port = 7882

  [[services.ports]]
    port = 7882

[[services]]
  # Raw TCP passthrough: no handlers, so fly-proxy forwards the ICE-TCP
  # bytes unchanged.
  protocol = "tcp"
  internal_port = 7881

  [[services.ports]]
    port = 7881

[[vm]]
  # Go SFU for a handful of staging participants.
  size = "shared-cpu-1x"
  memory = "512mb"
