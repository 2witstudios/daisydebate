# Fly.io app definition for the daisy-debate org's scale-to-zero staging
# environment (AUTH-7.0). See docs/operations/deploy-staging.md for the
# create -> secrets -> deploy -> verify -> rollback -> destroy runbook; every
# non-default line below is explained inline. Schema verified against the
# installed flyctl (v0.4.105) and https://fly.io/docs/reference/configuration/.
#
# App name: replace before first `fly launch`/`fly deploy` if the owner picks
# a different one; it fixes the hostname https://<app>.fly.dev (no custom
# domain per the task's owner decisions).
app = "daisy-debate-staging"

# Chicago (ord): closest Fly region to the owner (America/Chicago). Staging
# has no user-facing latency requirement; this only sets where the single
# machine lives.
primary_region = "ord"

[build]
  # apps/web/Dockerfile builds the whole monorepo context; run `fly deploy`
  # from the repository root so this relative path resolves.
  dockerfile = "apps/web/Dockerfile"

[deploy]
  # Migrations run once per release, never at app boot (start.ts refuses to
  # run them itself) — see AGENTS.md "Releases" and docs/operations/production.md.
  # `bun db:migrate` (the root package.json script) is not used here: it
  # runs `bun --env-file=.env packages/db/scripts/migrate.ts`, and no .env
  # file exists in this image (Fly injects DATABASE_URL etc. as real process
  # env via `fly secrets`) — `--env-file=.env` would fail before ever
  # reading DATABASE_URL. The runtime image's WORKDIR is /app/apps/web
  # (apps/web/Dockerfile), which has no db:migrate script of its own, so
  # this invokes the migration runner (copied into the image alongside
  # packages/db/migrations) by absolute path instead.
  # Credentials (ISSUE-39): the runner connects with MIGRATION_DATABASE_URL,
  # the schema owner, and refuses to run in production without it or when
  # it names the same role as DATABASE_URL. The app connects with
  # DATABASE_URL as the DML-only daisy_web role and refuses to start as any
  # role that can create or alter schema objects. Both are Fly secrets.
  release_command = "bun /app/packages/db/scripts/migrate.ts"

[env]
  # Non-secret configuration. Secrets (BETTER_AUTH_SECRET, RESEND_API_KEY,
  # AUTH_EMAIL_FROM, RESEND_WEBHOOK_SECRET, DATABASE_URL, MIGRATION_DATABASE_URL,
  # REDIS_URL) are set with `fly secrets set`, never written here (fly.toml
  # is committed; scripts/verify-deploy-config.ts refuses a database URL here).
  PORT = "8080"
  PUBLIC_APP_URL = "https://daisy-debate-staging.fly.dev"
  REDIS_NAMESPACE = "daisy"
  LOG_LEVEL = "info"
  # AUTH_TRUSTED_PROXIES: Fly's edge (fly-proxy) terminates the client TLS
  # connection and forwards over its private 6PN network, so the app's own
  # ingress (apps/web/src/server/ingress.ts) sees fly-proxy's 6PN peer
  # address on the socket, not the caller's address, unless this is trusted
  # so the code instead reads the caller's address from the right-hand end
  # of X-Forwarded-For (fly-proxy sets Fly-Client-IP and X-Forwarded-For per
  # https://fly.io/docs/networking/request-headers/). fdaa::/8 is Fly's
  # entire 6PN ULA prefix (https://fly.io/docs/networking/private-networking/);
  # Fly does not document a narrower CIDR for fly-proxy's own address, so the
  # whole prefix is trusted here — see docs/operations/deploy-staging.md
  # "Client identity on Fly" for the verification step run on first deploy.
  # First-deploy finding (September 22): fly-proxy reaches the app over
  # IPv4 from 172.16.0.0/12 (observed peers 172.16.x and 172.19.x), not
  # from the fdaa::/8 6PN prefix, so trusting only fdaa::/8 left every
  # caller resolved to the proxy's address — one shared rate-limit bucket.
  # Only fly-proxy can reach a machine with no dedicated public IP, so the
  # private IPv4 range is trusted as well.
  # Second finding: after trusting 172.16/12 the resolved caller became a
  # Fly edge node (66.241.125.x), i.e. the X-Forwarded-For chain is
  # "<caller>, <edge>" and the edge hop is public. Fly's anycast edge range
  # 66.241.124.0/22 is trusted too. The durable fix is to read Fly's
  # authoritative Fly-Client-IP header at ingress (tracked as a follow-up).
  AUTH_TRUSTED_PROXIES = "fdaa::/8,172.16.0.0/12,66.241.124.0/22"

[http_service]
  # Must match Dockerfile EXPOSE and the PORT env above.
  internal_port = 8080
  # Reject plaintext; fly-proxy issues the TLS cert for <app>.fly.dev.
  force_https = true
  # Owner decision (AUTH-7.0): the box must not be always-on.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Fly's liveness probe: process aliveness only, no dependency calls.
    # This is what schedules a restart, not what gates traffic.
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health/live"
    timeout = "2s"

  [[http_service.checks]]
    # Readiness: 200 only when not draining AND Postgres and Redis answer
    # within 2s (apps/web/src/app/api/health/ready/route.ts). fly-proxy
    # only routes traffic to a machine passing its checks.
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health/ready"
    timeout = "3s"

[[vm]]
  # Smallest Fly VM size. Memory measured locally (docker run --memory,
  # production config, against the *_test stack): idle ~125MiB, ~156MiB
  # after a few SSR page hits, against a 256mb container limit (61% used,
  # ~100MiB headroom). 256mb (Fly's minimum increment) boots and answers
  # /api/health/ready but leaves little margin for concurrent staging
  # traffic; 512mb is the smallest size with real headroom under load. See
  # docs/operations/deploy-staging.md "Idle cost" for the full measurement.
  size = "shared-cpu-1x"
  memory = "512mb"
