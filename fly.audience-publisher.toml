# Staging audience publisher (ADR 0112, DEC-350, owner sign-off): writes each Round's
# released public state to the public bucket about once a second, so a viewer's read
# never reaches web. Its image is the `audience-publisher` target of apps/web/Dockerfile.
# Its database login reads released facts, it holds the public bucket's key and not the
# hold's, and its secrets are all Fly secrets. It has no public service. It runs always:
# a stopped publisher leaves every viewer on a stale page.
app = "daisy-debate-staging-publisher"
primary_region = "ord"
kill_timeout = 10

[build]
  dockerfile = "apps/web/Dockerfile"
  build-target = "audience-publisher"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
